<div class="space-y-6">
  <app-page-header 
    title="Admin Panel" 
    subtitle="System overview and user management" 
  />

  <app-stats-card [stats]="stats()" [columns]="4" />

  <app-data-table
    [config]="tableConfig()"
    [data]="allUsers()"
    [loading]="loading()"
    [paginationConfig]="paginationConfig()"
    (createClick)="openCreateModal()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
  
  <app-modal
    [isOpen]="!!selectedUser()"
    [title]="'User Details'"
    (close)="closeModal()"
  >
    <app-user-detail-modal [user]="selectedUser()" />
  </app-modal>
  
  <app-modal
    [isOpen]="showCreateModal()"
    [title]="'Create New User'"
    (close)="closeCreateModal()"
  >
    <app-create-user-modal 
      (close)="closeCreateModal()"
      (save)="onCreateUser($event)"
    />
  </app-modal>
</div>
