<div class="space-y-6">
  <app-page-header title="Admin Panel" subtitle="System overview and user management" />

  @if (handlers.failed()) {
    <div class="rounded-2xl border border-ink-200 dark:border-night-border bg-white dark:bg-night-surface">
      <app-error-state [message]="states.ADMIN_ERROR" (retry)="handlers.loadDashboardData()" />
    </div>
  }

  <app-stats-card [stats]="stats()" [columns]="4" (choose)="volumeCurrency.choose($event)" />

  <app-data-table
    [config]="tableConfig()"
    [data]="allUsers()"
    [loading]="loading()"
    [paginationConfig]="paginationConfig()"
    (createClick)="openCreateModal()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />

  @if (handlers.next()) {
    <div class="flex justify-center">
      <button
        type="button"
        class="min-h-11 rounded-lg border border-ink-200 dark:border-night-border px-4 py-2 text-sm font-medium text-ink-700 dark:text-night-text hover:bg-ink-50 dark:hover:bg-night-bg disabled:opacity-60"
        [disabled]="loading()"
        (click)="handlers.loadMoreUsers()"
      >
        {{ loadMoreLabel }}
      </button>
    </div>
  }

  <app-modal [isOpen]="!!selectedUser()" [title]="'User Details'" (close)="closeModal()">
    <app-user-detail-modal [user]="selectedUser()" />
  </app-modal>

  <app-modal [isOpen]="showCreateModal()" [title]="'Create New User'" (close)="closeCreateModal()">
    <app-create-user-modal (close)="closeCreateModal()" (save)="onCreateUser($event)" />
  </app-modal>
</div>
