<section class="grid grid-cols-[repeat(auto-fit,minmax(240px,1fr))] gap-5" aria-label="Originals">
  @for (tile of tiles; track tile.id) {
    <article class="flex flex-col overflow-hidden rounded-[26px] bg-surface-1 depth-1 text-text">
      <div class="relative flex h-[170px] items-center justify-center gap-[18px]" [class]="tile.glow" aria-hidden="true">
        @switch (tile.id) {
          @case ('wheel') {
            <span class="art-wheel h-32 w-32 rounded-full"></span>
          }
          @case ('dice') {
            <span class="art-die grid h-[72px] w-[72px] -rotate-[14deg] grid-cols-3 rounded-[18px] p-3">
              <span class="h-2.5 w-2.5 rounded-full bg-raised-deep"></span><span></span><span></span>
              <span></span><span class="h-2.5 w-2.5 rounded-full bg-raised-deep"></span><span></span>
              <span></span><span></span><span class="h-2.5 w-2.5 rounded-full bg-raised-deep"></span>
            </span>
            <span class="art-die-live grid h-[60px] w-[60px] translate-y-4 rotate-[18deg] place-items-center rounded-2xl">
              <span class="h-3 w-3 rounded-full bg-white"></span>
            </span>
          }
          @case ('penalty') {
            <span class="art-goal absolute left-1/2 top-[26px] h-[92px] w-[180px] -translate-x-1/2 rounded-t-lg border-[5px] border-b-0"></span>
            <span class="art-ball absolute bottom-[18px] left-1/2 h-11 w-11 -translate-x-1/2 rounded-full"></span>
          }
        }
      </div>
      <div class="flex items-center justify-between gap-3 px-5 py-[18px]">
        <span class="flex min-w-0 flex-col gap-0.5">
          <strong class="font-display font-medium text-lg">{{ tile.name }}</strong>
          <span class="text-[13px] text-text-muted">{{ tile.description }}</span>
        </span>
        <span class="shrink-0 font-bold" [class]="tile.statClass">{{ tile.stat }}</span>
      </div>
    </article>
  }
</section>
