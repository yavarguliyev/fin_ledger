<div class="space-y-6">
  <app-page-header title="Ledger" subtitle="Double-entry accounting view" />

  @if (account() && isUser()) {
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white dark:bg-night-surface rounded-xl border border-ink-200 dark:border-night-border p-5">
        <p class="text-xs text-ink-500 dark:text-night-muted">Account ID</p>
        <p class="font-mono text-sm text-ink-900 dark:text-white mt-1 truncate">{{ account()!.id }}</p>
      </div>
      <div class="bg-white dark:bg-night-surface rounded-xl border border-ink-200 dark:border-night-border p-5">
        <p class="text-xs text-ink-500 dark:text-night-muted">Account Type</p>
        <p class="text-sm font-semibold text-ink-900 dark:text-white mt-1">{{ account()!.accountType }}</p>
      </div>
      <div class="bg-white dark:bg-night-surface rounded-xl border border-ink-200 dark:border-night-border p-5">
        <p class="text-xs text-ink-500 dark:text-night-muted">Balance</p>
        <p class="text-lg font-bold text-ink-900 dark:text-white mt-1">{{ account()!.balanceMinor | currencyFormat: account()!.currency }}</p>
      </div>
    </div>
  }

  @if (failed() && !loading()) {
    <div class="rounded-2xl border border-ink-200 dark:border-night-border bg-white dark:bg-night-surface">
      <app-error-state [message]="states.LEDGER_ERROR" (retry)="loadEntries()" />
    </div>
  }

  <app-data-table [config]="tableConfig()" [data]="entries()" [loading]="loading()" />

  @if (hasMore()) {
    <div class="flex justify-center" appLoadOnScroll [paused]="loading()" (reached)="loadOlder()">
      <button
        type="button"
        class="rounded-lg border border-ink-200 dark:border-night-border px-4 py-2 text-sm font-medium text-ink-700 dark:text-night-text hover:bg-ink-50 dark:hover:bg-night-bg disabled:opacity-60"
        [disabled]="loading()"
        (click)="loadOlder()"
      >
        {{ loadOlderLabel }}
      </button>
    </div>
  }
</div>
