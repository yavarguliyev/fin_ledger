@if (preview(); as row) {
  @if (row.ticks !== labels.TICKS.NONE) {
    <svg
      class="h-3.5 w-4 shrink-0"
      [class]="row.ticks === labels.TICKS.SEEN ? 'text-chat-seen' : 'text-ink-400 dark:text-white/60'"
      viewBox="0 0 20 14"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      role="img"
      [attr.aria-label]="row.ticks === labels.TICKS.SEEN ? labels.SEEN_LABEL : labels.SENT_LABEL"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M1 7.5l4 4L13 2"></path>
      <path stroke-linecap="round" stroke-linejoin="round" d="M7 7.5l4 4L19 2"></path>
    </svg>
  }
  @switch (row.icon) {
    @case ('photo') {
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linejoin="round" stroke-width="2" d="M4 8h3l2-3h6l2 3h3v11H4z"></path>
        <circle cx="12" cy="13" r="3.5" stroke-width="2"></circle>
      </svg>
    }
    @case ('video') {
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="6" width="13" height="12" rx="2" stroke-width="2"></rect>
        <path stroke-linejoin="round" stroke-width="2" d="M16 10l5-3v10l-5-3z"></path>
      </svg>
    }
    @case ('voice') {
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3" stroke-width="2"></rect>
        <path stroke-linecap="round" stroke-width="2" d="M5 11a7 7 0 0014 0M12 18v3"></path>
      </svg>
    }
    @case ('file') {
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linejoin="round" stroke-width="2" d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"></path>
        <path stroke-linejoin="round" stroke-width="2" d="M14 3v5h5"></path>
      </svg>
    }
    @case ('deleted') {
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke-width="2"></circle>
        <path stroke-linecap="round" stroke-width="2" d="M5.6 5.6l12.8 12.8"></path>
      </svg>
    }
  }
  <span class="truncate" [class.italic]="row.icon === labels.ICONS.DELETED">{{ row.text }}</span>
}
