<button
  type="button"
  class="grid h-9 w-9 place-items-center rounded-full text-ink-500 hover:bg-ink-100 dark:hover:bg-night-bg"
  [attr.aria-label]="search.open() ? labels.CLOSE_LABEL : labels.OPEN_LABEL"
  [title]="search.open() ? labels.CLOSE_LABEL : labels.OPEN_LABEL"
  (click)="search.toggle()"
>
  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7" stroke-width="2"></circle>
    <path stroke-linecap="round" stroke-width="2" d="M20 20l-3.5-3.5"></path>
  </svg>
</button>

@if (search.open()) {
  <div
    class="absolute right-0 top-11 z-30 w-80 max-w-[calc(100vw-2rem)] rounded-2xl border border-ink-100 dark:border-night-border bg-white dark:bg-night-card shadow-xl"
  >
    <input
      type="search"
      autofocus
      class="w-full rounded-t-2xl border-b border-ink-100 dark:border-night-border bg-transparent px-4 py-3 text-sm text-ink-900 dark:text-white placeholder-ink-400 focus:outline-none"
      [placeholder]="labels.PLACEHOLDER"
      [attr.aria-label]="labels.PLACEHOLDER"
      (input)="search.search($any($event.target).value)"
    />

    @if (search.results(); as results) {
      <ul class="max-h-80 overflow-y-auto py-1">
        @for (hit of results; track hit.id) {
          <li>
            <button
              type="button"
              class="w-full px-4 py-2 text-left hover:bg-ink-50 dark:hover:bg-night-bg"
              (click)="search.reveal({ messageId: hit.id })"
            >
              <p class="line-clamp-2 text-sm text-ink-900 dark:text-white">{{ hit.body }}</p>
              <p class="mt-0.5 text-[11px] text-ink-400">{{ hit.createdAt | date: 'medium' }}</p>
            </button>
          </li>
        } @empty {
          <li class="px-4 py-3 text-sm text-ink-400">{{ labels.NO_RESULTS }}</li>
        }
      </ul>
    }
  </div>
}
