<div class="flex h-full flex-col">
  @if (contacts().length === 0) {
    <p class="px-4 py-8 text-center text-sm text-ink-400">{{ labels.NO_CONTACTS }}</p>
  } @else {
    <ul class="flex-1 overflow-y-auto divide-y divide-ink-100 dark:divide-ink-800">
      @for (contact of contacts(); track contact.userId) {
        <li>
          <button
            type="button"
            (click)="picked.emit(contact.userId)"
            class="w-full flex items-center gap-3 px-4 py-3 text-left transition-colors hover:bg-ink-50 dark:hover:bg-night-bg"
            [class.bg-primary/5]="contact.userId === selectedStaffId()"
            [attr.aria-current]="contact.userId === selectedStaffId() ? 'true' : null"
          >
            <app-support-avatar [name]="contact.displayName" [showDot]="true" [online]="isOnline(contact)" />

            <span class="min-w-0 flex-1">
              <span class="flex items-baseline justify-between gap-2">
                <span class="truncate text-sm font-medium text-ink-900 dark:text-white">{{ contact.displayName }}</span>
                <span class="shrink-0 text-[11px] capitalize text-ink-400">{{ roleLabel(contact) }}</span>
              </span>

              <span class="mt-0.5 flex items-center justify-between gap-2">
                <span class="truncate text-xs" [class]="isOnline(contact) ? 'text-success' : 'text-ink-500 dark:text-night-muted'">
                  {{ status(contact) }}
                </span>
                @if (unread(contact) > 0) {
                  <span class="shrink-0 min-w-5 px-1.5 py-0.5 rounded-full bg-primary text-[11px] font-semibold text-white text-center">
                    {{ unread(contact) }}
                  </span>
                }
              </span>
            </span>
          </button>
        </li>
      }
    </ul>
  }
</div>
