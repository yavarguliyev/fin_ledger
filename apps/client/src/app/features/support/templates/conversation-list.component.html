<div class="flex h-full flex-col">
  @if (conversations().length === 0) {
    <p class="px-4 py-8 text-center text-sm text-ink-400">{{ labels.STAFF_EMPTY_QUEUE }}</p>
  } @else {
    <ul class="flex-1 overflow-y-auto divide-y divide-ink-100 dark:divide-ink-800">
      @for (conversation of conversations(); track conversation.id) {
        <li>
          <button
            type="button"
            (click)="picked.emit(conversation.id)"
            class="w-full flex items-start gap-3 px-4 py-3 text-left transition-colors hover:bg-ink-50 dark:hover:bg-night-bg"
            [class.bg-primary/5]="conversation.id === selectedId()"
            [attr.aria-current]="conversation.id === selectedId() ? 'true' : null"
          >
            <app-support-avatar [name]="conversation.customerName" [url]="conversation.customerAvatarUrl ?? null" />

            <span class="min-w-0 flex-1">
              <span class="flex items-baseline justify-between gap-2">
                <span class="truncate text-sm font-medium text-ink-900 dark:text-white">
                  {{ conversation.customerName || labels.TEAM }}
                </span>
                <span class="shrink-0 text-[11px] text-ink-400">{{ time(conversation) }}</span>
              </span>

              <span class="mt-0.5 flex items-center justify-between gap-2">
                <app-chat-row-preview [conversation]="conversation" />
                <app-chat-row-badges [conversation]="conversation" />
              </span>
            </span>
          </button>
        </li>
      }
    </ul>
  }
</div>
