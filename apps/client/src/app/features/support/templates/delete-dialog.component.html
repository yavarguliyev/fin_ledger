@if (message()) {
  <div
    class="fixed inset-0 z-50 grid place-items-center bg-black/40 px-4"
    role="dialog"
    aria-modal="true"
    (click)="cancelled.emit()"
    (keydown.escape)="cancelled.emit()"
  >
    <div class="w-full max-w-xs rounded-2xl bg-white dark:bg-night-card p-5 shadow-xl" appFocusTrap (click)="$event.stopPropagation()">
      <h3 class="mb-4 text-sm font-semibold text-ink-900 dark:text-white">{{ rules.DELETE_TITLE }}</h3>

      <div class="flex flex-col items-end gap-1">
        @if (forEveryone()) {
          <button
            type="button"
            class="rounded-full px-4 py-2 text-sm font-medium text-danger-deep dark:text-danger-light hover:bg-danger/10"
            (click)="chosen.emit(rules.SCOPE_EVERYONE)"
          >
            {{ rules.DELETE_FOR_EVERYONE }}
          </button>
        }
        <button type="button" class="rounded-full px-4 py-2 text-sm font-medium text-danger-deep dark:text-danger-light hover:bg-danger/10" (click)="chosen.emit(rules.SCOPE_ME)">
          {{ rules.DELETE_FOR_ME }}
        </button>
        <button
          type="button"
          class="rounded-full px-4 py-2 text-sm font-medium text-ink-600 dark:text-ink-300 hover:bg-ink-100 dark:hover:bg-night-bg"
          (click)="cancelled.emit()"
        >
          {{ rules.CANCEL }}
        </button>
      </div>
    </div>
  </div>
}
