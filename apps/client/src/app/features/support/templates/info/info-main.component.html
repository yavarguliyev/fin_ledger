<section class="flex flex-col items-center px-2 pb-5 pt-1 text-center">
  <button
    type="button"
    class="rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-chat-accent disabled:cursor-default"
    [disabled]="!panel.contact()?.avatarUrl"
    [attr.aria-label]="photoLabels.OPEN_LABEL"
    (click)="photos.open({ url: panel.contact()?.avatarUrl ?? null, name: name() ?? '' })"
  >
    <app-support-avatar size="xl" [name]="name()" [url]="panel.contact()?.avatarUrl ?? null" />
  </button>
  <h3 class="mt-3 text-[20px] font-semibold leading-tight text-ink-900 dark:text-white">{{ name() }}</h3>
  @if (subtitle()) {
    <p class="mt-0.5 text-[14px] text-ink-500 dark:text-night-muted">{{ subtitle() }}</p>
  }
  @if (status()) {
    <p class="mt-0.5 text-[13px]" [class.text-chat-accent]="online()" [class.text-ink-400]="!online()">{{ status() }}</p>
  }
</section>

<div class="grid grid-cols-3 gap-2">
  @for (tile of [labels.VOICE, labels.VIDEO, labels.SEARCH]; track tile) {
    <button
      type="button"
      class="flex h-14 flex-col items-center justify-center gap-1 rounded-[10px] bg-chat-card text-[12px] text-ink-900 transition-colors hover:bg-black/[0.03] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-chat-accent dark:bg-chat-card-dark dark:text-white"
      (click)="tile === labels.VOICE ? voice() : tile === labels.VIDEO ? video() : find()"
    >
      <span class="text-chat-accent dark:text-chat-accent-dark" aria-hidden="true">
        @switch (tile) {
          @case (labels.VOICE) {
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.95.68l1.5 4.49a1 1 0 01-.5 1.21l-2.26 1.13a11 11 0 005.52 5.52l1.13-2.26a1 1 0 011.21-.5l4.49 1.5a1 1 0 01.68.95V19a2 2 0 01-2 2h-1C9.72 21 3 14.28 3 6V5z"></path>
            </svg>
          }
          @case (labels.VIDEO) {
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 10l4.55-2.28A1 1 0 0121 8.62v6.76a1 1 0 01-1.45.9L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
          }
          @default {
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" stroke-width="1.8"></circle>
              <path stroke-linecap="round" stroke-width="1.8" d="M20 20l-3.5-3.5"></path>
            </svg>
          }
        }
      </span>
      {{ tile }}
    </button>
  }
</div>

<div class="mt-5" [class]="labels.CARD">
  <app-info-row [label]="labels.SHARED_ROW" [value]="sharedCount()" (pressed)="nav.go({ page: pages.SHARED })">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" stroke-width="1.7"></rect>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M3 16l5-5 4 4 3-3 6 6"></path>
      <circle cx="16" cy="9" r="1.5" stroke-width="1.5"></circle>
    </svg>
  </app-info-row>
  <app-info-row [label]="labels.STARRED_ROW" [value]="starredCount()" (pressed)="nav.go({ page: pages.STARRED })">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linejoin="round" stroke-width="1.7" d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path>
    </svg>
  </app-info-row>
  <app-info-row [label]="labels.STORAGE_ROW" [value]="storageSize()" (pressed)="nav.go({ page: pages.STORAGE })">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <ellipse cx="12" cy="6" rx="7" ry="2.5" stroke-width="1.7"></ellipse>
      <path stroke-width="1.7" d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"></path>
    </svg>
  </app-info-row>
</div>

<div class="mt-5" [class]="labels.CARD">
  <app-info-row [label]="labels.PRIVACY_ROW" [value]="privacy.enabled() ? labels.ON : labels.OFF" (pressed)="nav.go({ page: pages.PRIVACY })">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linejoin="round" stroke-width="1.7" d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M9 12l2 2 4-4"></path>
    </svg>
  </app-info-row>
  <app-info-row [label]="labels.LOCK_ROW" [value]="locks.activeLocked() ? labels.ON : labels.OFF" (pressed)="nav.go({ page: pages.LOCK })">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <rect x="5" y="11" width="14" height="10" rx="2" stroke-width="1.7"></rect>
      <path stroke-linecap="round" stroke-width="1.7" d="M8 11V8a4 4 0 018 0v3"></path>
    </svg>
  </app-info-row>
</div>

<app-info-preferences />

@if (panel.contact(); as contact) {
  @if (!contact.isStaff) {
    <div class="mt-5" [class]="labels.CARD">
      <app-info-row [label]="labels.DETAILS_ROW" (pressed)="nav.go({ page: pages.DETAILS })">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" stroke-width="1.7"></circle>
          <circle cx="12" cy="10" r="3" stroke-width="1.7"></circle>
          <path stroke-linecap="round" stroke-width="1.7" d="M6.5 18.5c1.3-2 3.2-3 5.5-3s4.2 1 5.5 3"></path>
        </svg>
      </app-info-row>
    </div>
    @if (isAdmin()) {
      <a
        class="mt-5 flex min-h-11 items-center rounded-[10px] bg-chat-card px-4 text-[14px] text-chat-accent hover:bg-black/[0.03] dark:bg-chat-card-dark dark:text-chat-accent-dark"
        [routerLink]="adminRoute"
      >
        {{ labels.ADMIN_ROW }}
      </a>
    }
  }
}
