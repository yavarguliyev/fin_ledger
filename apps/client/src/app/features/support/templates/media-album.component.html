<div class="-mx-1.5 -mt-0.5 mb-1 grid w-[min(330px,70vw)] grid-cols-2 gap-0.5 overflow-hidden rounded-xl">
  @for (message of shown(); track message.id; let last = $last) {
    <button
      type="button"
      class="relative block aspect-square cursor-zoom-in overflow-hidden bg-black/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-white"
      [attr.aria-label]="message.attachment?.fileName ?? ''"
      (click)="opened.emit(message.id)"
    >
      @if (message.kind === labels.IMAGE_KIND) {
        <img class="object-cover" [ngSrc]="message.attachment?.url ?? ''" fill [alt]="message.attachment?.fileName ?? ''" />
      } @else {
        <video class="h-full w-full object-cover" [src]="message.attachment?.url" muted playsinline preload="metadata"></video>
        <span class="absolute inset-0 grid place-items-center" aria-hidden="true">
          <span class="grid h-11 w-11 place-items-center rounded-full bg-black/45 text-white">
            <svg class="ml-0.5 h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
          </span>
        </span>
      }
      @if (last && hidden() > 0) {
        <span class="absolute inset-0 grid place-items-center bg-black/50 text-3xl font-medium text-white">{{ labels.MORE_PREFIX }}{{ hidden() }}</span>
      }
    </button>
  }
</div>
