<aside class="hidden xl:flex w-64 shrink-0 flex-col border-l border-ink-200 dark:border-ink-800 bg-white dark:bg-night-card">
  <header class="px-4 py-3 border-b border-ink-200 dark:border-ink-800">
    <h2 class="text-sm font-semibold text-ink-900 dark:text-white">{{ labels.ONLINE_TITLE }}</h2>
    <p class="text-xs text-ink-500 dark:text-night-muted">{{ total() }} {{ view.AVAILABLE_LABEL }}</p>
  </header>

  @if (entries().length === 0) {
    <p class="px-4 py-6 text-center text-xs text-ink-400">{{ labels.NOBODY_ONLINE }}</p>
  } @else {
    <ul class="flex-1 overflow-y-auto py-2">
      @for (entry of entries(); track entry.userId) {
        <li class="flex items-center gap-3 px-4 py-2">
          <app-support-avatar [name]="entry.displayName" size="sm" [showDot]="true" [online]="isOnline(entry)" />
          <span class="min-w-0">
            <span class="block truncate text-sm text-ink-900 dark:text-white">{{ entry.displayName }}</span>
            <span class="block truncate text-xs capitalize text-ink-500 dark:text-night-muted">{{ roleLabel(entry) }}</span>
          </span>
        </li>
      }
    </ul>
  }
</aside>
