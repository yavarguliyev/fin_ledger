<span
  class="relative inline-flex shrink-0 items-center justify-center rounded-full bg-primary/15 text-primary font-semibold select-none"
  [class]="size() === 'sm' ? 'w-9 h-9 text-xs' : 'w-11 h-11 text-sm'"
>
  {{ initials }}
  @if (showDot()) {
    <span
      class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white dark:border-night-card"
      [class]="online() ? 'bg-success' : 'bg-ink-300'"
      [attr.aria-label]="online() ? 'Online' : 'Offline'"
    ></span>
  }
</span>
