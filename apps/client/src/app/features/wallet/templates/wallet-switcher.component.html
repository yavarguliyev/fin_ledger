<div class="flex flex-wrap items-center gap-2">
  @for (wallet of wallets(); track wallet.id) {
    <button
      type="button"
      (click)="select(wallet)"
      class="flex min-h-11 flex-col items-start rounded-2xl border px-4 py-2 text-left transition-colors"
      [class]="
        wallet.id === activeWalletId()
          ? 'border-action bg-action/15 text-text nav-glow'
          : 'border-line bg-surface-1 text-text hover:border-action'
      "
    >
      <span class="text-xs font-bold text-text-muted">{{ wallet.currency }}</span>
      <span class="font-display text-sm font-bold tabular-nums">{{ wallet.availableBalanceMinor | currencyFormat: wallet.currency }}</span>
    </button>
  }

  @if (openableCurrencies().length === 0) {
    <button
      type="button"
      (click)="showOpenableCurrencies()"
      class="min-h-11 rounded-2xl border border-dashed border-line px-4 py-2 text-sm font-semibold text-text-muted transition-colors hover:border-action hover:text-text"
    >
      + Add currency
    </button>
  } @else {
    @for (currency of openableCurrencies(); track currency) {
      <button
        type="button"
        (click)="open(currency)"
        [disabled]="opening()"
        class="min-h-11 rounded-2xl border border-action/40 px-3 py-2 text-sm font-semibold text-text transition-colors hover:bg-action/15 disabled:opacity-50"
      >
        {{ currency }}
      </button>
    }
  }
</div>
