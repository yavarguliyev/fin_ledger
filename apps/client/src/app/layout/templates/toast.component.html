<div class="fixed top-[4.5rem] right-2 z-[60] space-y-2 w-96 max-w-[calc(100vw-1rem)]" role="status" aria-live="polite">
  @if (confirmToast()) {
    <div class="toast-warning-solid flex flex-col gap-3 p-4 rounded-2xl animate-slideIn border-l-4">
      <div class="flex items-center gap-3">
        <app-icon class="toast-icon h-5 w-5 shrink-0" name="triangle-alert" />
        <p class="flex-1 text-sm font-medium">{{ confirmToast()!.message }}</p>
      </div>
      <div class="flex gap-2 justify-end border-t border-line pt-3">
        <button
          (click)="handleCancel()"
          class="min-h-11 px-4 rounded-xl text-sm font-semibold border border-line bg-surface-1 text-text hover:border-action transition-colors"
        >
          Cancel
        </button>
        <button
          (click)="handleConfirm()"
          class="min-h-11 px-4 rounded-xl text-sm font-semibold border border-loss/40 bg-loss/15 text-loss hover:bg-loss/25 transition-colors"
        >
          Delete
        </button>
      </div>
    </div>
  }

  @for (t of toasts(); track t.id) {
    <div
      class="flex items-center gap-3 p-4 rounded-2xl animate-slideIn border-l-4 font-medium"
      [class.toast-success-solid]="t.type === 'success'"
      [class.toast-error-solid]="t.type === 'error'"
      [class.toast-warning-solid]="t.type === 'warning'"
      [class.toast-info-solid]="t.type === 'info'"
    >
      <app-icon class="toast-icon h-5 w-5 shrink-0" [name]="icon(t.type)" />
      <p class="flex-1 text-sm">{{ t.message }}</p>
      <button
        (click)="dismiss(t.id)"
        class="rounded-md px-1 text-current opacity-50 transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-current/30"
        aria-label="Dismiss notification"
      >
        <app-icon class="h-4 w-4" name="x" />
      </button>
    </div>
  }
</div>
