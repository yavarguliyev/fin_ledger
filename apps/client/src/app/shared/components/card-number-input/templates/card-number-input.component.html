<div class="relative">
  <div class="absolute left-3.5 top-1/2 -translate-y-1/2 flex items-center pointer-events-none">
    @switch (brand()) {
      @case ('visa') {
        <svg class="w-8 h-5" viewBox="0 0 48 32" fill="none">
          <rect width="48" height="32" rx="4" fill="#1A1F71"/>
          <path d="M19.5 21h-3l1.9-11.5h3L19.5 21zm8-11.5l-2.8 7.9-.3-1.6-1-5.1s-.1-1.2-1.5-1.2h-4.6l-.1.3s1.6.3 3.4 1.5l2.8 10.7h3.1l4.8-12.5h-3.8zm15.2 11.5h2.7L43 9.5h-2.4c-1.1 0-1.4.8-1.4.8l-4.4 10.7h3.1l.6-1.7h3.8l.4 1.7zM39 17.3l1.6-4.3.9 4.3H39zM32 12.2l.4-2.5s-1.3-.5-2.6-.5c-1.5 0-4.9.6-4.9 3.7 0 2.9 4 2.9 4 4.4s-3.6 1.2-4.7.3l-.4 2.6s1.3.6 3.3.6c2 0 5-1 5-3.8 0-2.9-4-3.2-4-4.4 0-1.2 2.7-1 3.9-.4z" fill="white"/>
        </svg>
      }
      @case ('mastercard') {
        <svg class="w-8 h-5" viewBox="0 0 48 32" fill="none">
          <rect width="48" height="32" rx="4" fill="#252525"/>
          <circle cx="19" cy="16" r="8" fill="#EB001B"/>
          <circle cx="29" cy="16" r="8" fill="#F79E1B"/>
          <path d="M24 10.3A8 8 0 0 1 26.4 16 8 8 0 0 1 24 21.7 8 8 0 0 1 21.6 16 8 8 0 0 1 24 10.3z" fill="#FF5F00"/>
        </svg>
      }
      @case ('amex') {
        <svg class="w-8 h-5" viewBox="0 0 48 32" fill="none">
          <rect width="48" height="32" rx="4" fill="#2E77BC"/>
          <text x="24" y="19" text-anchor="middle" fill="white" font-size="8" font-weight="bold" font-family="Inter, sans-serif">AMEX</text>
        </svg>
      }
      @case ('discover') {
        <svg class="w-8 h-5" viewBox="0 0 48 32" fill="none">
          <rect width="48" height="32" rx="4" fill="#FF6000"/>
          <text x="24" y="19" text-anchor="middle" fill="white" font-size="7" font-weight="bold" font-family="Inter, sans-serif">DISCOVER</text>
        </svg>
      }
      @default {
        <svg class="w-5 h-5 text-ink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
        </svg>
      }
    }
  </div>

  <input
    type="text"
    inputmode="numeric"
    autocomplete="cc-number"
    [value]="displayValue()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="onBlur()"
    class="w-full pl-14 pr-4 py-2.5 rounded-lg border border-ink-300 dark:border-night-border bg-white dark:bg-night-bg text-sm font-mono tracking-wider text-ink-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/40 transition-colors"
  />

  @if (rawValue().length >= 13) {
    <div class="absolute right-3.5 top-1/2 -translate-y-1/2">
      @if (isLuhnValid()) {
        <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
      } @else {
        <svg class="w-5 h-5 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
        </svg>
      }
    </div>
  }
</div>
