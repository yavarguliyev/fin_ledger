<div class="relative">
  <button
    #trigger
    type="button"
    (click)="toggle()"
    [disabled]="isDisabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="dialog"
    class="w-full flex items-center justify-between gap-3 px-4 py-2.5 rounded-lg border border-ink-300 dark:border-night-border bg-white dark:bg-night-bg text-left focus:outline-none focus:ring-2 focus:ring-primary/40 disabled:opacity-60 disabled:cursor-not-allowed"
  >
    <span [class]="display() ? 'text-ink-900 dark:text-white' : 'text-ink-400 dark:text-ink-500'">{{ display() || placeholder() }}</span>
    <svg class="h-5 w-5 text-ink-400 dark:text-ink-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
      <rect x="3" y="5" width="18" height="16" rx="2"></rect>
      <path d="M3 10h18M8 3v4M16 3v4" stroke-linecap="round"></path>
    </svg>
  </button>

  @if (isOpen() && view(); as current) {
    <div
      role="dialog"
      [attr.aria-label]="ariaLabel()"
      class="absolute z-30 mt-2 w-72 max-w-[calc(100vw-2rem)] rounded-xl border border-ink-200 dark:border-night-border bg-white dark:bg-night-surface shadow-xl p-3"
    >
      <div class="flex items-center gap-2 mb-3">
        <button
          type="button"
          (click)="moveMonths(-1)"
          [attr.aria-label]="text.PREVIOUS_MONTH"
          class="p-1.5 rounded-lg text-ink-500 hover:bg-ink-100 dark:hover:bg-night-hover"
        >
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m12 5-5 5 5 5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <select
          [attr.aria-label]="text.MONTH_LABEL"
          (change)="pickMonth($event)"
          class="flex-1 min-w-0 rounded-lg border border-ink-200 dark:border-night-border bg-white dark:bg-night-bg text-sm text-ink-900 dark:text-white px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary/40"
        >
          @for (name of monthNames; track $index) {
            <option [value]="$index + 1" [selected]="$index + 1 === current.month">{{ name }}</option>
          }
        </select>
        <select
          [attr.aria-label]="text.YEAR_LABEL"
          (change)="pickYear($event)"
          class="w-24 rounded-lg border border-ink-200 dark:border-night-border bg-white dark:bg-night-bg text-sm text-ink-900 dark:text-white px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary/40"
        >
          @for (year of years(); track year) {
            <option [value]="year" [selected]="year === current.year">{{ year }}</option>
          }
        </select>
        <button
          type="button"
          (click)="moveMonths(1)"
          [attr.aria-label]="text.NEXT_MONTH"
          class="p-1.5 rounded-lg text-ink-500 hover:bg-ink-100 dark:hover:bg-night-hover"
        >
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m8 5 5 5-5 5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-ink-400 dark:text-ink-500 mb-1" aria-hidden="true">
        @for (weekday of weekdays; track weekday) {
          <span>{{ weekday }}</span>
        }
      </div>

      <div
        role="grid"
        tabindex="0"
        [attr.aria-activedescendant]="text.DAY_ID_PREFIX + focused()"
        (keydown)="onGridKeydown($event)"
        class="grid grid-cols-7 gap-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/40"
      >
        @for (cell of cells(); track $index) {
          @if (cell) {
            <button
              type="button"
              role="gridcell"
              tabindex="-1"
              [id]="text.DAY_ID_PREFIX + cell"
              [disabled]="!isSelectable(cell)"
              [attr.aria-selected]="cell === value()"
              (click)="select(cell)"
              [class]="dayClass(cell)"
            >
              {{ dayOf(cell) }}
            </button>
          } @else {
            <span></span>
          }
        }
      </div>
    </div>
  }
</div>
