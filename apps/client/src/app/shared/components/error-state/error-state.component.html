<div class="flex flex-col items-center gap-2 px-5 py-10 text-center" role="alert">
  <span class="grid h-12 w-12 place-items-center rounded-full bg-danger/10 text-xl text-danger-deep dark:text-danger-light" aria-hidden="true">!</span>
  <p class="text-sm font-semibold text-ink-900 dark:text-white">{{ title() }}</p>
  <p class="max-w-sm text-sm text-ink-500 dark:text-night-muted">{{ message() }}</p>
  <app-button class="mt-2" variant="secondary" [busy]="retrying()" (pressed)="retry.emit()">
    <span [class.animate-spin]="retrying()" aria-hidden="true">↻</span>
    {{ labels.RETRY_LABEL }}
  </app-button>
</div>
