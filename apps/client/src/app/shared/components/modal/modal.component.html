@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-stretch sm:items-center justify-center p-0 sm:p-4 bg-black/60 backdrop-blur-sm animate-fadeIn"
    (click)="onBackdropClick($event)"
  >
    <div
      class="bg-white dark:bg-night-surface border border-ink-200 dark:border-night-border h-[100dvh] sm:h-auto sm:max-h-[90vh] overflow-y-auto rounded-none sm:rounded-2xl pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] sm:pt-0 sm:pb-0 w-full {{
        maxWidth()
      }} shadow-2xl animate-scaleIn"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? titleId : null"
      appFocusTrap
      (click)="$event.stopPropagation()"
    >
      @if (title() || showCloseButton()) {
        <div class="flex items-center justify-between px-6 py-4 border-b border-ink-200 dark:border-night-border">
          <h3 [id]="titleId" class="text-lg font-bold text-ink-900 dark:text-white">{{ title() }}</h3>
          @if (showCloseButton()) {
            <button
              type="button"
              [attr.aria-label]="labels.CLOSE_LABEL"
              (click)="onClose()"
              class="-m-2 flex h-11 w-11 items-center justify-center text-ink-400 hover:text-ink-700 dark:hover:text-white transition-colors"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          }
        </div>
      }

      <div class="p-6">
        <ng-content />
      </div>
    </div>
  </div>
}
