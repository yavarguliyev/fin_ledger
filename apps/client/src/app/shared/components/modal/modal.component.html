@if (isOpen()) {
  <div 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn"
    (click)="onBackdropClick($event)"
  >
    <div 
      class="bg-white dark:bg-night-surface border border-ink-200 dark:border-night-border rounded-2xl w-full {{ maxWidth() }} shadow-2xl animate-scaleIn"
      (click)="$event.stopPropagation()"
    >
      @if (title() || showCloseButton()) {
        <div class="flex items-center justify-between px-6 py-4 border-b border-ink-200 dark:border-night-border">
          <h3 class="text-lg font-bold text-ink-900 dark:text-white">{{ title() }}</h3>
          @if (showCloseButton()) {
            <button 
              type="button" 
              (click)="onClose()" 
              class="text-ink-400 hover:text-ink-700 dark:hover:text-white transition-colors"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          }
        </div>
      }
      
      <div class="p-6">
        <ng-content />
      </div>
    </div>
  </div>
}
