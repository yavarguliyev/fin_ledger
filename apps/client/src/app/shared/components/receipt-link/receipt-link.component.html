@if (paymentId()) {
  <div class="inline-flex items-center gap-1">
    <button
      type="button"
      (click)="view($event)"
      [attr.aria-label]="text.VIEW_LABEL"
      [title]="text.VIEW_LABEL"
      class="flex h-9 w-9 items-center justify-center rounded-xl text-text-muted transition-colors hover:bg-surface-2 hover:text-live focus:outline-none focus:ring-2 focus:ring-action/40"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke-linejoin="round"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
    <button
      type="button"
      (click)="download($event)"
      [attr.aria-label]="text.DOWNLOAD_LABEL"
      [title]="text.DOWNLOAD_LABEL"
      class="flex h-9 w-9 items-center justify-center rounded-xl text-text-muted transition-colors hover:bg-surface-2 hover:text-live focus:outline-none focus:ring-2 focus:ring-action/40"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
        <path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </div>
}
