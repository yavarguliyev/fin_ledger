<div
  class="mt-6 grid grid-cols-2 gap-4"
  [ngClass]="{
    'lg:grid-cols-2': columns() === 2,
    'lg:grid-cols-3': columns() === 3,
    'lg:grid-cols-4': columns() === 4
  }"
>
  @for (stat of stats(); track stat.label) {
    <div class="flex flex-col gap-3.5 rounded-[22px] bg-surface-1 depth-1 p-5 overflow-hidden">
      <div class="flex items-center justify-between">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl rim" [ngClass]="stat.toneClass ?? 'bg-action/15 text-action'">
          <app-icon class="h-5 w-5" [name]="stat.icon" />
        </span>
        @if (stat.spark) {
          <app-sparkline [class]="stat.sparkClass ?? 'text-action'" [values]="stat.spark" />
        } @else if (stat.trend) {
          <span class="text-xs font-medium px-2 py-0.5 rounded-full" [ngClass]="stat.toneClass ?? ''">
            {{ stat.trend }}
          </span>
        }
      </div>
      <p class="font-display font-bold text-[26px] leading-tight text-text tabular-nums truncate">{{ stat.value }}</p>
      <p class="text-sm text-text-muted">{{ stat.label }}</p>
      @if (stat.choices) {
        <div class="flex flex-wrap gap-1" role="group" [attr.aria-label]="stat.label + ' currency'">
          @for (choice of stat.choices; track choice.key) {
            <button
              type="button"
              (click)="choose.emit(choice.key)"
              [attr.aria-pressed]="choice.active"
              class="px-2 py-0.5 rounded-md text-xs font-medium border transition-colors"
              [ngClass]="
                choice.active
                  ? 'border-primary bg-primary/10 text-primary-dark dark:text-primary-light'
                  : 'border-ink-200 dark:border-night-border text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-night-bg'
              "
            >
              {{ choice.label }}
            </button>
          }
        </div>
      }
    </div>
  }
</div>
