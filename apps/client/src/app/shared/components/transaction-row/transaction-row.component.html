<div class="flex items-center gap-3.5 border-t border-line py-3">
  <span class="flex h-[42px] w-[42px] shrink-0 items-center justify-center rounded-[14px]" [class]="tone()">
    <app-icon class="h-5 w-5" [name]="icon()" />
  </span>
  <div class="flex min-w-0 flex-1 flex-col gap-0.5">
    <span class="truncate text-[15px] font-semibold text-text">{{ title() }}</span>
    @if (detailed()) {
      <span class="flex flex-wrap items-center gap-2 text-[13px] text-text-muted">
        {{ row().createdAt | date: view.TIME_FORMAT }}
        <span class="font-mono text-xs">{{ reference() }}</span>
        <span class="inline-flex h-[22px] items-center rounded-full px-2.5 text-[11px] font-bold" [class]="statusTone()">{{ row().status }}</span>
      </span>
    } @else {
      <span class="text-[13px] text-text-muted">{{ row().createdAt | date: view.DATE_TIME_FORMAT }}</span>
    }
  </div>
  @if (detailed()) {
    <app-receipt-link [reference]="row().reference" [status]="row().status" />
  }
  <span class="shrink-0 font-bold tabular-nums" [class]="amountTone()">{{ sign() }}{{ row().amountMinor | currencyFormat: row().currency }}</span>
</div>
