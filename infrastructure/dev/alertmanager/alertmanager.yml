route:
  receiver: core-api
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Firing and resolved alerts become admin notifications in the app and an e-mail to every admin
  # (console transport until SMTP is configured). ALERT_WEBHOOK_TOKEN must match apps/core-api/.env.
  # Telegram goes straight from Alertmanager, so "API down" still arrives when the API is the thing that is down.
  # start.sh fills in TELEGRAM_CHAT_ID, or drops the telegram block when TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are unset.
  - name: core-api
    webhook_configs:
      - url: 'http://host.docker.internal:3000/api/v1/monitoring/alerts'
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/alert-webhook-token
    # telegram:begin
    telegram_configs:
      - bot_token_file: /tmp/telegram-bot-token
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        parse_mode: HTML
    # telegram:end
