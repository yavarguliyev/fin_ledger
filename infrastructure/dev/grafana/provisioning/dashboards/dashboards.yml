apiVersion: 1

providers:
  # Dashboard provider for local JSON files
  - name: 'default'
    orgId: 1
    folder: 'DDD Dashboards'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
