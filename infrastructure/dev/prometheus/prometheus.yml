global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ddd-dev'
    environment: 'development'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Alert rules, evaluated every evaluation_interval
rule_files:
  - 'alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ClickHouse metrics
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
        labels:
          service: 'clickhouse'
    metrics_path: '/metrics'

  # Node.js API metrics: served at the server root (/metrics, outside the /api prefix) on the API port
  - job_name: 'nestjs-api'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'core-api'
    metrics_path: '/metrics'

  # Redis internals (redis_exporter in docker-compose)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # PostgreSQL internals (postgres_exporter in docker-compose)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # RabbitMQ metrics (built-in)
  # - job_name: 'rabbitmq'
  #   static_configs:
  #     - targets: ['rabbitmq:15692']
  #       labels:
  #         service: 'rabbitmq'

  # Kafka JMX exporter (optional - requires jmx_exporter)
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka:7071']
  #       labels:
  #         service: 'kafka'
